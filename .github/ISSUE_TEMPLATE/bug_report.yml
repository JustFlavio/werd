name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Werd version
      description: Shown in the sidebar or under About.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: Output of `werd doctor` and any relevant log lines (Logs page or `werd logs <id> <service>`).
      render: text
