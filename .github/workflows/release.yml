name: Release

# One version and one app release. Runtime builds live in werd-runtimes.
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# RELEASE_PLATFORMS: windows (alpha default), macos, linux; stable requires all.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing application tag to build or retry (e.g. v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  PLATFORMS: ${{ vars.RELEASE_PLATFORMS || 'windows' }}

jobs:
  plan:
    name: Validate and plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: plan
        run: node scripts/release/plan.mjs
      - run: node --test scripts/release/*.test.mjs
      - name: Prepare release notes and draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npx --yes git-cliff@2 --latest --strip header > notes.md
          printf '\nBuilt platforms: %s. See README for current support and known limitations.\n' "$PLATFORMS" >> notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo "Published versions are immutable" >&2; exit 1; }
          else
            flags=(--draft --verify-tag --latest=false)
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${flags[@]}" --title "Werd $VERSION" --notes-file notes.md
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: node scripts/release/plan.mjs --check
      - run: npm run check && npm run build && npm test
      - run: cargo test --workspace --locked
      - run: node scripts/package.mjs --sidecars-only
      - name: Build and upload to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Werd ${{ needs.plan.outputs.version }}
          releaseDraft: true
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config ${{ matrix.config }} --config src-tauri/tauri.${{ needs.plan.outputs.channel }}.conf.json

  publish:
    name: Validate artifacts and publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check all required installers and signed updater entries
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > releases.json
          node scripts/release/validate.mjs latest.json releases.json
      - name: Publish the complete release
        run: |
          if [ "$CHANNEL" = preview ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
      - name: Advance the updater channel
        run: node scripts/release/update-channel.mjs latest.json
