# Git hooks, installed by `npm install` (see the "prepare" script).
# Skip once with LEFTHOOK=0 if you really need to.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,json,css}"
      run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all -- --check

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
