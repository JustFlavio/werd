# git-cliff configuration: CHANGELOG.md is generated from Conventional Commits.
#   git cliff -o CHANGELOG.md                 # whole history
#   git cliff --tag v0.2.0 -o CHANGELOG.md    # before tagging a release

[changelog]
header = """
# Changelog

All notable changes to Werd are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project uses
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Pre-launch experiment tags were retired before the first alpha. This history keeps
the source changes, including earlier distribution experiments. See the
[release policy](docs/releases.md) for the current version and channel rules.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %}
{% endfor -%}
{% endfor %}

"""
footer = "<!-- generated by git-cliff -->"
trim = true

[git]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta|rc)\\.[0-9]+)?$"
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^(build|chore)(\\(release\\))?: [Bb]ump version", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(style|chore)", skip = true },
]
