[package]
name = "werd-core"
version = "0.1.1"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"

[[bin]]
name = "werd-daemon"
path = "src/main.rs"
